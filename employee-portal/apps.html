<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ระบบและแอปพลิเคชัน | Employee Portal</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284C7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BW Portal">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="assets/icons/app-icon.png" alt="BW Logo" class="brand-img">
        <span>Employee Portal</span>
      </a>

      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" class="nav-link">ข่าวสารและประกาศ</a></li>
          <li><a href="apps.html" class="nav-link active">ระบบและแอปพลิเคชัน</a></li>
          <li><a href="contact.html" class="nav-link">ติดต่อสอบถาม/แจ้งปัญหา</a></li>
          <li><a href="admin.html" id="navAdminLink" class="nav-link admin-pill" style="display: none;">⚙️ Admin Panel</a></li>
        </ul>
      </nav>

      <div class="nav-user" id="navUser">
        <!-- Rendered by auth.js -->
      </div>

      <button id="navBtnInstallPWA" class="btn-pwa-nav" onclick="PWA.promptInstall()" title="ติดตั้งแอปบนอุปกรณ์">
        📲 ติดตั้งแอป
      </button>

      <button class="nav-mobile-toggle" id="mobileToggle" aria-label="Toggle Navigation">
        ☰
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">
    <div class="page-header animate-fade-in">
      <h1 class="page-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        ศูนย์รวมระบบและแอปพลิเคชันองค์กร
      </h1>
      <p class="page-subtitle">เข้าถึงระบบสารสนเทศ แอปพลิเคชันภายใน และบริการดิจิทัลต่างๆ ได้ในจุดเดียว</p>
    </div>

    <!-- Filter and Search Bar -->
    <div class="filter-bar animate-fade-in">
      <div class="search-box">
        <div class="input-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchApps" class="form-control" placeholder="ค้นหาชื่อระบบ, แอปพลิเคชัน หรือคำอธิบาย...">
        </div>
      </div>

      <div class="filter-categories">
        <button class="filter-btn active" data-category="ALL">ทั้งหมด</button>
        <button class="filter-btn" data-category="HR">HR</button>
        <button class="filter-btn" data-category="Production">Production</button>
        <button class="filter-btn" data-category="Finance">Finance</button>
        <button class="filter-btn" data-category="Quality">Quality</button>
        <button class="filter-btn" data-category="Dashboard">Dashboard</button>
        <button class="filter-btn" data-category="External Link">External Link</button>
      </div>
    </div>

    <!-- Apps Cards Grid -->
    <div class="apps-grid" id="appsGrid">
      <!-- Injected by js/apps.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="nav-container" style="height: auto; justify-content: center; flex-direction: column; gap: 0.35rem;">
      <p>&copy; 2027 Employee Portal — Internal Enterprise Solutions. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme-seasonal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
